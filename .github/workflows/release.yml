name: Draft Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Read release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?<preview>-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
              throw 'Use a version tag such as v0.1.0 or v0.2.0-beta.1.'
          }
          "ORTILO_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
          "ORTILO_PRERELEASE=$([bool]$Matches.preview)" >> $env:GITHUB_ENV
      - name: Test and publish Native AOT
        shell: pwsh
        run: |
          dotnet test Ortilo.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Ortilo.App -c Release -r win-x64 "-p:Version=$env:ORTILO_VERSION"
      - name: Smoke-test and package
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'src/Ortilo.App/bin/Release/net10.0-windows/win-x64/publish/Ortilo.exe').Path
          dotnet run --project tests/Ortilo.Windows.Smoke -c Release -- $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath $exe, 'README.md', 'LICENSE', 'assets' -DestinationPath "Ortilo-$env:GITHUB_REF_NAME-win-x64.zip"
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:ORTILO_VERSION" "/DReleaseTag=$env:GITHUB_REF_NAME" installer/Ortilo.iss
      - name: Smoke-test installer
        shell: pwsh
        run: |
          $setup = "artifacts\Ortilo-$env:GITHUB_REF_NAME-win-x64-setup.exe"
          $testRoot = Join-Path $env:RUNNER_TEMP ("ortilo-install-" + [guid]::NewGuid())
          $installDir = Join-Path $testRoot 'app'
          $env:ORTILO_CONFIG = Join-Path $testRoot '.ortilo\config.json'
          $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="{0}"' -f $installDir))

          $install = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }

          $exe = Join-Path $installDir 'Ortilo.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Ortilo.lnk'
          if (!(Test-Path -LiteralPath $exe) -or !(Test-Path -LiteralPath $shortcut)) {
              throw 'Installer did not create the executable and Start menu shortcut.'
          }
          $config = Get-Content -LiteralPath $env:ORTILO_CONFIG -Raw | ConvertFrom-Json
          $config.showTopBar = $false
          $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $env:ORTILO_CONFIG
          $expected = Get-FileHash -LiteralPath $env:ORTILO_CONFIG

          $reinstall = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($reinstall.ExitCode -ne 0) { throw "Reinstall exited with code $($reinstall.ExitCode)." }
          if ((Get-FileHash -LiteralPath $env:ORTILO_CONFIG).Hash -ne $expected.Hash) {
              throw 'Reinstall changed the user configuration.'
          }
          $check = Start-Process -FilePath $exe -ArgumentList 'check-config' -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Installed Ortilo rejected the user configuration.' }

          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $exe) -or (Test-Path -LiteralPath $shortcut)) {
              throw 'Uninstall did not remove Ortilo and its Start menu shortcut.'
          }
          if ((Get-FileHash -LiteralPath $env:ORTILO_CONFIG).Hash -ne $expected.Hash) {
              throw 'Uninstall changed the user configuration.'
          }
      - name: Create draft on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFlags = @('--verify-tag', '--draft', '--generate-notes')
          if ($env:ORTILO_PRERELEASE -eq 'True') { $releaseFlags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME "artifacts/Ortilo-$env:GITHUB_REF_NAME-win-x64-setup.exe" "Ortilo-$env:GITHUB_REF_NAME-win-x64.zip" @releaseFlags
